name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Set up pinned package managers
        run: npm install --global npm@11.9.0 corepack@0.34.6
      - name: Prepare pinned Core and devices archives
        run: npm run prepare:rackdown
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:dist
      - run: npm run test:release
      - run: npm run package:release
      - name: Verify release assets
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json')).version")
          cd ".rackdown/release/$version"
          sha256sum --check SHA256SUMS
          sha256sum main.js manifest.json styles.css "rackdown-$version.zip" SHA256SUMS
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          release = Path.cwd()
          dist = release.parents[2] / 'dist'
          for name in ('main.js', 'manifest.json', 'styles.css'):
              assert (release / name).read_bytes() == (dist / name).read_bytes(), name
          with ZipFile(f'rackdown-{release.name}.zip') as archive:
              assert archive.testzip() is None
              expected = sorted('rackdown/' + str(p.relative_to(dist))
                                for p in dist.rglob('*') if p.is_file())
              assert archive.namelist() == expected
              for entry in archive.infolist():
                  assert archive.read(entry) == (dist / entry.filename.removeprefix('rackdown/')).read_bytes()
                  assert entry.date_time == (1980, 1, 1, 0, 0, 0)
                  assert entry.external_attr >> 16 == 0o100644
          PY
          cd ../../..
          sha256sum .rackdown/core.tgz .rackdown/devices.tgz
          git diff --exit-code
